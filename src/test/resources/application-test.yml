spring:
  datasource:
    url: jdbc:h2:mem:order_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration-test

order:
  integration:
    system-a:
      api-key: dev-system-a-key
    system-b:
      api-key: dev-system-b-key
